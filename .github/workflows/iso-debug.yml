name: iso-debug

# 手动调试：用 init=/bin/bash 启动 live ISO，通过串口交互执行安装器，抓取挂起点
on:
  workflow_dispatch:
    inputs:
      artifact_id:
        description: "含 arm64 ISO 的 artifact id"
        required: true

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: 安装工具
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-arm qemu-efi-aarch64 qemu-utils xorriso

      - name: 下载 ISO artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p work && cd work
          curl -sL -H "Authorization: token $GH_TOKEN" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${{ inputs.artifact_id }}/zip" -o art.zip
          unzip -o -q art.zip -d art
          ISO=$(find art -name '*.iso' | head -1)
          [ -n "$ISO" ] || { echo no-iso; exit 1; }
          cp "$ISO" in.iso
          ls -lh in.iso

      - name: 改写 GRUB 为 init=/bin/bash
        working-directory: work
        run: |
          {
            echo 'set default=0'
            echo 'set timeout=1'
            echo 'menuentry "debug bash" {'
            echo '    linux /live/vmlinuz boot=live components live-media=/dev/sr0 console=tty0 console=ttyAMA0,115200 loglevel=5 init=/bin/bash'
            echo '    initrd /live/initrd.img'
            echo '}'
          } > grub.cfg
          xorriso -indev in.iso -outdev dbg.iso -boot_image any replay -map grub.cfg /boot/grub/grub.cfg -commit 2>&1 | tail -3
          ls -lh dbg.iso

      - name: 串口交互执行安装器
        working-directory: work
        run: |
          qemu-img create -f qcow2 disk.qcow2 12G >/dev/null
          rm -f serial.sock
          timeout 240 qemu-system-aarch64 -M virt,virtualization=true -cpu cortex-a76 -m 3072 -smp 2 \
            -bios /usr/share/qemu-efi-aarch64/QEMU_EFI.fd \
            -device nec-usb-xhci,id=xhci \
            -drive if=none,id=cd,format=raw,media=cdrom,file="$PWD/dbg.iso" \
            -device usb-storage,bus=xhci.0,drive=cd \
            -drive file="$PWD/disk.qcow2",if=none,id=disk,format=qcow2 \
            -device virtio-blk-pci,drive=disk \
            -device VGA -display none -monitor none -no-reboot \
            -serial "unix:$PWD/serial.sock,server=on,wait=off" >/dev/null 2>&1 &
          QPID=$!
          python3 - <<'PYEOF' > manual.log 2>&1 || true
          import socket, time, sys
          sock = None
          for _ in range(60):
              try:
                  sock = socket.socket(socket.AF_UNIX)
                  sock.settimeout(2)
                  sock.connect("serial.sock")
                  break
              except Exception:
                  sock = None
                  time.sleep(2)
          if not sock:
              print("no serial socket")
              sys.exit(0)
          buf = ""
          def read_until(token, timeout=90):
              global buf
              end = time.time() + timeout
              while time.time() < end:
                  try:
                      data = sock.recv(4096)
                  except Exception:
                      data = b""
                  if not data:
                      continue
                  buf += data.decode("utf-8", "replace")
                  if token in buf:
                      return True
              return False
          read_until("login:", 120)
          print("=== serial ready ===")
          sock.sendall(b"root\n")
          time.sleep(3)
          read_until("#", 20)
          cmds = [
              "mount -t proc proc /proc",
              "mount -t sysfs sys /sys",
              "mount -t devtmpfs dev /dev 2>/dev/null || true",
              "echo LINGOS-MANUAL-TEST",
              "bash -x /usr/local/sbin/lingos-install --auto",
          ]
          for c in cmds:
              sock.sendall((c + "\n").encode())
              time.sleep(4)
              read_until("LINGOS-", 5)
          time.sleep(120)
          try:
              sock.settimeout(1)
              while True:
                  d = sock.recv(65536)
                  if not d:
                      break
                  buf += d.decode("utf-8", "replace")
          except Exception:
              pass
          print(buf[-120000:])
          PYEOF
          kill $QPID 2>/dev/null || true
          wait $QPID 2>/dev/null || true
          tail -c 80000 manual.log

      - name: 上传日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iso-debug-log
          path: |
            work/manual.log
            work/grub.cfg
          if-no-files-found: warn
