name: iso-debug

# 手动调试：init=/bin/bash 启动 live ISO，串口交互执行安装器，抓取挂起点
on:
  workflow_dispatch:
    inputs:
      artifact_id:
        description: "含 arm64 ISO 的 artifact id"
        required: true

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: 安装工具
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-arm qemu-efi-aarch64 qemu-utils xorriso

      - name: 下载 ISO artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p work && cd work
          curl -sL -H "Authorization: token $GH_TOKEN" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${{ inputs.artifact_id }}/zip" -o art.zip
          unzip -o -q art.zip -d art
          ISO=$(find art -name '*.iso' | head -1)
          [ -n "$ISO" ] || { echo no-iso; exit 1; }
          cp "$ISO" in.iso
          ls -lh in.iso

      - name: 改写 GRUB 为 init=/bin/bash
        working-directory: work
        run: |
          printf '%s\n' 'set default=0' 'set timeout=1' 'menuentry "debug bash" {' '    linux /live/vmlinuz boot=live components live-media=/dev/sr0 console=tty0 console=ttyAMA0,115200 loglevel=5 init=/bin/bash rw' '    initrd /live/initrd.img' '}' > grub.cfg
          xorriso -indev in.iso -outdev dbg.iso -boot_image any replay -map grub.cfg /boot/grub/grub.cfg -commit 2>&1 | tail -3
          ls -lh dbg.iso

      - name: 串口交互执行安装器
        working-directory: work
        run: |
          qemu-img create -f qcow2 disk.qcow2 12G >/dev/null
          rm -f /tmp/lingos-serial.sock
          timeout 300 qemu-system-aarch64 -M virt,virtualization=true -cpu cortex-a76 -m 3072 -smp 2 \
            -bios /usr/share/qemu-efi-aarch64/QEMU_EFI.fd \
            -device nec-usb-xhci,id=xhci \
            -drive if=none,id=cd,format=raw,media=cdrom,file="$PWD/dbg.iso" \
            -device usb-storage,bus=xhci.0,drive=cd \
            -drive file="$PWD/disk.qcow2",if=none,id=disk,format=qcow2 \
            -device virtio-blk-pci,drive=disk \
            -display none -monitor none -no-reboot \
            -serial "unix:/tmp/lingos-serial.sock,server=on,wait=off" > qemu.err 2>&1 &
          QPID=$!
          sleep 2
          ls -l /tmp/lingos-serial.sock || true
          cat qemu.err || true
          python3 - <<'PYEOF' > manual.log 2>&1 || true
          import socket, time, sys
          sock = None
          for i in range(180):
              try:
                  sock = socket.socket(socket.AF_UNIX)
                  sock.settimeout(3)
                  sock.connect("/tmp/lingos-serial.sock")
                  break
              except Exception:
                  sock = None
                  time.sleep(1)
          if not sock:
              print("NO-SERIAL-SOCKET after 180s")
              sys.exit(0)
          print("serial connected")
          buf = ""
          def pump(seconds):
              global buf
              end = time.time() + seconds
              while time.time() < end:
                  try:
                      d = sock.recv(65536)
                  except Exception:
                      d = b""
                  if d:
                      buf += d.decode("utf-8", "replace")
          pump(90)
          print("=== initial serial (tail) ===")
          print(buf[-8000:])
          cmds = [
              "mount -t proc proc /proc",
              "mount -t sysfs sys /sys",
              "mount -t devtmpfs dev /dev 2>/dev/null || true",
              "echo LINGOS-MANUAL-MARK",
              "bash -x /usr/local/sbin/lingos-install --auto",
          ]
          for c in cmds:
              print("SENDING:", c)
              sock.sendall((c + "\n").encode())
              time.sleep(2)
              pump(3)
          pump(150)
          print("=== final serial (tail 150000) ===")
          print(buf[-150000:])
          PYEOF
          kill $QPID 2>/dev/null || true
          wait $QPID 2>/dev/null || true
          echo "=== qemu.err ==="
          cat qemu.err || true
          echo "=== manual.log tail ==="
          tail -c 120000 manual.log

      - name: 上传日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iso-debug-log
          path: |
            work/manual.log
            work/qemu.err
            work/grub.cfg
          if-no-files-found: warn