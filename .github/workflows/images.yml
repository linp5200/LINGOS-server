name: images

# LING OS 镜像构建：
#   container  —— 容器镜像（构建 + 启动 + /system/health 冒烟 + artifact）
#   iso-x86_64 / iso-arm64 —— 安装 ISO（Ubuntu noble live-build，UEFI+BIOS hybrid，自动安装）
#   release    —— tag v* 时把 ISO 附加到 GitHub Release
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  container:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: 编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc make pkg-config \
            libcurl4-openssl-dev libseccomp-dev libsqlite3-dev \
            libmosquitto-dev libmicrohttpd-dev libssl-dev \
            python3 python3-venv python3-pip

      - name: 编译（pipefail）
        run: |
          set -o pipefail
          make 2>&1 | tail -40

      - name: 全捆打包
        run: RELEASE_VER=0.9.0 bash scripts/bundle.sh dist

      - name: 构建容器镜像
        run: |
          cp -f dist/*allbin*.tar.gz dist/lingos-container-bundle.tar.gz
          docker build -f distro/images/Dockerfile -t lingos-server:ci .

      - name: 容器冒烟（启动 + /system/health）
        run: |
          docker run -d --name lingos-ci -p 18080:8080 -p 12939:2939 lingos-server:ci
          ok=0
          for i in $(seq 1 60); do
            sleep 3
            if curl -m 3 -fsS http://127.0.0.1:18080/system/health >/dev/null 2>&1; then ok=1; break; fi
          done
          echo "health_probe=$ok"
          curl -m 5 -sS http://127.0.0.1:18080/system/health || true
          if [ "$ok" != "1" ]; then
            echo "--- container logs ---"
            docker logs lingos-ci | tail -120
            echo "--- in-container logs ---"
            docker cp lingos-ci:/LINGOS/log /tmp/lingos-logs || true
            ls -la /tmp/lingos-logs || true
            echo "=== lingosd.log ==="; cat /tmp/lingos-logs/lingosd.log 2>/dev/null || true
            echo "=== supervisor.log ==="; cat /tmp/lingos-logs/supervisor.log 2>/dev/null || true
            echo "=== lingos.log tail ==="; tail -c 8000 /tmp/lingos-logs/lingos.log 2>/dev/null || true
            echo "=== ps ==="; docker exec lingos-ci ps -ef || true
            docker rm -f lingos-ci
            exit 1
          fi
          echo "--- container logs (tail) ---"
          docker logs lingos-ci | tail -40

      - name: 导出镜像 artifact
        if: always()
        run: |
          docker save lingos-server:ci | gzip > /tmp/lingos-container-image.tar.gz
          ls -lh /tmp/lingos-container-image.tar.gz

      - name: 上传镜像 artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lingos-container-image
          path: /tmp/lingos-container-image.tar.gz

  iso-x86_64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 live-build 工具链
        run: |
          sudo apt-get update
          sudo apt-get install -y live-build debootstrap squashfs-tools xorriso \
            mtools dosfstools rsync genisoimage isolinux syslinux-common

      - name: 编译（pipefail）
        run: |
          set -o pipefail
          sudo apt-get install -y gcc make pkg-config libcurl4-openssl-dev libseccomp-dev \
            libsqlite3-dev libmosquitto-dev libmicrohttpd-dev libssl-dev \
            python3 python3-venv python3-pip
          make 2>&1 | tail -40

      - name: 全捆打包
        run: RELEASE_VER=0.9.0 bash scripts/bundle.sh dist

      - name: 构建 x86_64 ISO
        run: sudo bash distro/images/build-iso.sh x86_64

      - name: 上传 ISO artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lingos-installer-x86_64
          path: dist/images/lingos-installer-x86_64.iso
          if-no-files-found: warn

  iso-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: 安装 live-build 工具链
        run: |
          sudo apt-get update
          sudo apt-get install -y live-build debootstrap squashfs-tools xorriso \
            mtools dosfstools rsync genisoimage isolinux syslinux-common

      - name: 编译（pipefail）
        run: |
          set -o pipefail
          sudo apt-get install -y gcc make pkg-config libcurl4-openssl-dev libseccomp-dev \
            libsqlite3-dev libmosquitto-dev libmicrohttpd-dev libssl-dev \
            python3 python3-venv python3-pip
          make 2>&1 | tail -40

      - name: 全捆打包
        run: RELEASE_VER=0.9.0 bash scripts/bundle.sh dist

      - name: 构建 arm64 ISO
        run: sudo bash distro/images/build-iso.sh aarch64

      - name: 上传 ISO artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lingos-installer-arm64
          path: dist/images/lingos-installer-aarch64.iso
          if-no-files-found: warn

  release:
    needs: [iso-x86_64, iso-arm64]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: 下载 ISO artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: 'lingos-installer-*'
          path: /tmp/isos

      - name: 列出产物
        run: find /tmp/isos -type f -ls

      - name: 发布到 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            /tmp/isos/**/*.iso
          generate_release_notes: true
          overwrite_files: true
