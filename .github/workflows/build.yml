name: build-bundle

# LING OS 服务端全捆打包 CI（0.2.1 定稿——先生裁决 H4：CI 出全捆包，解压即用）
# 矩阵：x86_64 原生 + arm64 qemu 容器（DEPENDENCIES.md 平台定位）

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
            qemu: false
          - arch: arm64
            runner: ubuntu-22.04
            qemu: true
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: 安装 QEMU（arm64 容器模拟）
        if: matrix.qemu
        uses: docker/setup-qemu-action@v3

      - name: 编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc make pkg-config \
            libcurl4-openssl-dev libseccomp-dev libsqlite3-dev \
            libmosquitto-dev libmicrohttpd-dev libnotcurses-dev \
            python3 python3-venv python3-pip
          sudo apt-get install -y espeak-ng || true

      - name: 编译（rpath=$ORIGIN/../lib）
        run: make 2>&1 | tail -20

      - name: 全捆打包（lib/ 全捆 + venv + manifest）
        run: bash scripts/bundle.sh dist

      - name: 产物清单
        run: |
          ls -la dist/
          du -sh dist/*.tar.gz
          tar tzf dist/*.tar.gz | head -20

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: LINGOS-${{ matrix.arch }}
          path: dist/*.tar.gz

      - name: 创建 Release（tag 推送时）
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.gz
          generate_release_notes: true
