<!doctype html>
<html lang="zh-CN" data-theme="day">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f1ecdf">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/icon.svg">
<title>LING OS · 家宅防线</title>
<link rel="stylesheet" href="assets/app.css">
<script>
/* 旧 webdesk 注册过 sw.js，升级到新前端后旧 SW 仍可能接管请求，导致手机一直停在启动屏。
   这里注销所有旧 SW 并清掉 cache，避免“页面是新的、请求走旧缓存”的混合状态。 */
(function () {
  try {
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function (rs) {
        rs.forEach(function (r) { r.unregister(); });
      }).catch(function () {});
    }
    if (window.caches && caches.keys) {
      caches.keys().then(function (ks) {
        ks.forEach(function (k) {
          if (k.indexOf('lingos') >= 0 || k.indexOf('LINGOS') >= 0) caches.delete(k);
        });
      }).catch(function () {});
    }
  } catch (e) {}
})();
</script>
<script>
(function () {
  try {
    var t = localStorage.getItem('lo-theme');
    if (t !== 'day' && t !== 'night') {
      var h = new Date().getHours();
      t = (h >= 19 || h < 7) ? 'night' : 'day';
    }
    document.documentElement.dataset.theme = t;
  } catch (e) {}
})();
</script>
</head>
<body>

<!-- 启动 / 错误屏：先探 /api/health。失败只显示 err-noserver，绝不渲染模拟数据。 -->
<div class="boot" id="boot">
  <div class="boot-card">
    <div class="boot-logo">L</div>
    <div class="boot-body">
      <div class="boot-code" id="bootCode">正在连接 LING OS</div>
      <h1 id="bootTitle">等后台回话</h1>
      <p id="bootText">正在检查同一地址下的 Web 服务。</p>
      <div class="boot-meta" id="bootMeta"></div>
      <div class="boot-actions">
        <button class="btn btn--primary" id="bootRetry">重试连接</button>
        <button class="btn" id="bootSettings">填后台地址</button>
      </div>
    </div>
  </div>
</div>

<!-- 登录 / 初始化：setup=true 时同一表单用于创建管理员；成功后显示一次性 root key。 -->
<div class="auth" id="auth" hidden>
  <form class="auth-card" id="authForm">
    <div class="auth-head">
      <div class="boot-logo">L</div>
      <div><b>LING OS</b><small id="authSub">本机安全入口</small></div>
    </div>
    <div class="auth-title" id="authTitle">登录</div>
    <p class="auth-hint" id="authHint">这个家里的 Web 服务在本机，数据不出门。</p>
    <label class="field"><span>用户名</span><input id="authUser" autocomplete="username" value="admin" required></label>
    <label class="field"><span>密码</span><input id="authPass" type="password" autocomplete="current-password" minlength="8" placeholder="至少 8 位" required></label>
    <label class="field" id="pairField" hidden><span>配对码</span><input id="authPair" inputmode="numeric" placeholder="局域网首次访问要这 6 位"></label>
    <details class="auth-advanced" id="setupAdvanced" hidden>
      <summary>高级配置（可跳过）</summary>
      <label class="field"><span>设备名（可选）</span><input id="setupName" placeholder="例如：客厅那台"></label>
      <label class="field"><span>语言（可选）</span><select id="setupLang"><option value="">跳过</option><option value="zh">中文</option><option value="en">English</option></select></label>
      <label class="field"><span>隐私等级（可选）</span><select id="setupPriv"><option value="">跳过</option><option value="L1">L1 常规</option><option value="L2">L2 限制</option><option value="L3">L3 严格</option><option value="L4">L4 MAX</option></select></label>
      <div class="field"><span>导入插件清单（可选，JSON）</span><label class="filebtn">选择插件清单<input id="setupPlugin" type="file" accept="application/json" hidden></label></div>
    </details>
    <div class="auth-error" id="authError" role="status" aria-live="polite"></div>
    <button class="btn btn--primary auth-submit" id="authSubmit" type="submit">进入</button>
    <p class="auth-foot">本机 Web 桌面 · 首次使用会创建管理员</p>
  </form>
</div>

<!-- 主界面：七个视图由 app.js 渲染；data-layout 在竖屏/横屏之间自动切换。 -->
<div class="app" id="app" hidden>
  <aside class="rail" id="rail" aria-label="主导航"></aside>

  <div class="stage">
    <header class="bar">
      <div class="brand">LING OS <small id="barWhere">家宅防线</small></div>
      <div class="bar-spacer"></div>
      <div class="bar-tools">
        <span class="clock" id="clock" aria-label="当前时间">--:--</span>
        <button class="icon-btn" id="refreshBtn" aria-label="刷新" title="刷新"><span data-icon="refresh" data-icon-size="17"></span></button>
        <button class="icon-btn" id="themeBtn" aria-label="日夜切换" title="日夜切换"><span data-icon="moon" data-icon-size="17"></span></button>
        <button class="icon-btn" id="logoutBtn" aria-label="退出" title="退出"><span data-icon="person" data-icon-size="17"></span></button>
      </div>
    </header>

    <main class="board" id="board">
      <section class="view" id="view-home" hidden></section>
      <section class="view" id="view-devices" hidden></section>
      <section class="view" id="view-files" hidden></section>
      <section class="view" id="view-security" hidden></section>
      <section class="view" id="view-ai" hidden></section>
      <section class="view" id="view-system" hidden></section>
      <section class="view" id="view-settings" hidden></section>
    </main>
  </div>
</div>

<div class="tabbar" id="tabbar" hidden aria-label="底部导航"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<!-- 危险动作确认条：开锁 / 切等级 / 删用户或设备 / 恢复备份 -->
<div class="confirm" id="confirm" role="dialog" aria-modal="true" aria-labelledby="confirmTitle" aria-describedby="confirmBody">
  <div class="confirm-card">
    <h3 id="confirmTitle" data-confirm-title>确认一下</h3>
    <p data-confirm-body id="confirmBody"></p>
    <div class="confirm-cols">
      <button class="btn" data-confirm-cancel>算了</button>
      <button class="btn btn--primary" data-confirm-ok>确定</button>
    </div>
  </div>
</div>

<!-- 启动看门狗：主脚本异常/请求挂起时，也必须落到 err-noserver，不允许无限等待。 -->
<script>
setTimeout(function () {
  try {
    var boot = document.getElementById('boot');
    var code = document.getElementById('bootCode');
    if (!boot || boot.hidden || !code) return;
    if (code.textContent.indexOf('正在连接') !== 0) return;
    code.textContent = 'err-noserver';
    document.getElementById('bootTitle').textContent = '后台没回话';
    document.getElementById('bootText').textContent =
      '这个页面必须接后台才能用。手机上先确认：地址是电脑/手机的局域网 IP、服务用 --lan 启动过、8080 没被别的程序占用。';
    document.getElementById('bootMeta').textContent =
      '页面：' + location.href + '\nUA：' + navigator.userAgent;
  } catch (e) {}
}, 6000);
</script>
<!-- 测试终端：Ctrl+A 打开、Ctrl+Q 关闭；打开时隐藏日志区，导航与设置仍可用 -->
<div class="term" id="term" hidden aria-label="测试终端">
  <div class="term-head"><b>LING OS · 测试终端</b><span>help 看命令 · Ctrl+Q 返回</span>
    <button class="term-close" data-act="close-term" aria-label="关闭终端">×</button></div>
  <pre class="term-out" id="termOut" aria-live="polite"></pre>
  <form class="term-form" id="termForm"><input id="termInput" autocomplete="off" spellcheck="false" aria-label="终端命令" placeholder="输入命令，例如 health / devices / cmd system.status"></form>
</div>
<script src="assets/app.js"></script>
</body>
</html>
